apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catjob
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/barisMarathon/devops-marathon-gitops.git
    targetRevision: main
    path: manifests/catjob
  destination:
    server: https://kubernetes.default.svc
    namespace: catjob
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
