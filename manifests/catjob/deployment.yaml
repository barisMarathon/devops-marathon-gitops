# Backend: the API. Stateless (all data is in Postgres), so it rolls out without downtime and
# can run more replicas when needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catjob-backend
  labels:
    app: catjob-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catjob-backend
  template:
    metadata:
      labels:
        app: catjob-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/barismarathon/catjob-backend
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: COOKIE_SECURE
              value: "true"
            - name: LOG_LEVEL
              value: info
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catjob-postgres
                  key: password
            # $(POSTGRES_PASSWORD) is expanded by Kubernetes from the variable above
            - name: DATABASE_URL
              value: postgres://catjob:$(POSTGRES_PASSWORD)@catjob-postgres:5432/catjob
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
# Frontend: nginx serving the static client and proxying /api and /photos to the backend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catjob-frontend
  labels:
    app: catjob-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catjob-frontend
  template:
    metadata:
      labels:
        app: catjob-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/barismarathon/catjob-frontend
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_URL
              value: http://catjob-backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
