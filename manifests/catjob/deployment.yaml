# Backend: the API, with all data in Postgres. Still one replica with Recreate while it mounts
# the old JSON store volume (catjob-data) to import it once; once the import is confirmed, the
# volume and LEGACY_DATA_DIR go away and the backend can run several replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catjob-backend
  labels:
    app: catjob-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catjob-backend
  template:
    metadata:
      labels:
        app: catjob-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/barismarathon/catjob-backend
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: COOKIE_SECURE
              value: "true"
            - name: LOG_LEVEL
              value: info
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catjob-postgres
                  key: password
            # $(POSTGRES_PASSWORD) is expanded by Kubernetes from the variable above
            - name: DATABASE_URL
              value: postgres://catjob:$(POSTGRES_PASSWORD)@catjob-postgres:5432/catjob
            - name: LEGACY_DATA_DIR
              value: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          # Not read-only on purpose: the previous image still writes here until the new one rolls out
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catjob-data
---
# Frontend: nginx serving the static client and proxying /api and /photos to the backend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catjob-frontend
  labels:
    app: catjob-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catjob-frontend
  template:
    metadata:
      labels:
        app: catjob-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/barismarathon/catjob-frontend
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_URL
              value: http://catjob-backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
