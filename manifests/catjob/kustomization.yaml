apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - postgres.yaml
  - backup.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# newTag is bumped by CI in barisMarathon/catJob on every push to main (both images share the tag)
images:
  - name: ghcr.io/barismarathon/catjob-backend
    newTag: sha-42e2809
  - name: ghcr.io/barismarathon/catjob-frontend
    newTag: sha-42e2809
