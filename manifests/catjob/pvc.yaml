# The retired JSON store (db.json + photos/) from before Postgres. Nothing mounts it any more;
# it is kept as a cold backup. To retire it, delete it by hand and remove this file together:
#   kubectl -n catjob delete pvc catjob-data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catjob-data
  annotations:
    # Prune=false: never deleted by an automated sync; Delete=false: kept if the app is deleted
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
