apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-html
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>devops-marathon</title>
      <style>
        body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
               display: grid; place-items: center; min-height: 100vh; margin: 0; }
        main { text-align: center; }
        code { color: #7ee787; }
      </style>
    </head>
    <body>
      <main>
        <h1>Hello from devops-marathon 👋</h1>
        <p>Served by <code>nginx</code> on <code>k3s</code>, deployed by <code>Argo CD</code> from Git.</p>
      </main>
    </body>
    </html>
