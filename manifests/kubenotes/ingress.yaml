# Public. No tls.secretName needed: Traefik serves the default wildcard certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubenotes
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: kubenotes.devopsdelisi.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubenotes
                port:
                  name: http
---
# Same host, /login and /setup only, with the rate limit. Explicit priority: Traefik orders
# routers by rule length, and Path(`/login`) is exactly as long as PathPrefix(`/`), so without
# it the catch-all router could win and skip the rate limit.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubenotes-auth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: kubenotes-login-ratelimit@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  ingressClassName: traefik
  rules:
    - host: kubenotes.devopsdelisi.fun
      http:
        paths:
          - path: /login
            pathType: Exact
            backend:
              service:
                name: kubenotes
                port:
                  name: http
          - path: /setup
            pathType: Exact
            backend:
              service:
                name: kubenotes
                port:
                  name: http
