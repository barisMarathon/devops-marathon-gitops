# KubeNotes has no login, so it is reachable only from the tailnet.
# DNS points kubenotes.devopsdelisi.fun at the node's Tailscale IP; this allow-list also blocks
# anyone who hits the public IP with a forged Host header. Needs real client IPs at Traefik
# (externalTrafficPolicy: Local, see manifests/traefik/helmchartconfig.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10          # Tailscale IPv4 (CGNAT range)
      - fd7a:115c:a1e0::/48    # Tailscale IPv6
