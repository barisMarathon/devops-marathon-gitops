# KubeNotes is public; the app does its own login (bcrypt passwords, roles).
# The app has no brute-force protection of its own, so Traefik rate-limits the login
# endpoint per client IP (Traefik sees real IPs since it binds 80/443 via hostPort).
# 5 attempts per minute on average, bursts of up to 10.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-ratelimit
spec:
  rateLimit:
    average: 5
    period: 1m
    burst: 10
