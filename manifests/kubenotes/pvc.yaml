# Notes live in SQLite on this volume (k3s local-path).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubenotes-data
  annotations:
    # Prune=false: never deleted by an automated sync; Delete=false: kept if the app is deleted
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
